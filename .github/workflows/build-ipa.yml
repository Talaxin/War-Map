name: Build War Map IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "WarMap/**"
      - "WarMap.xcodeproj/**"
      - "warmap.png"
      - "icon.jpeg"
      - "icons/**"
      - "scripts/**"
      - ".github/workflows/build-ipa.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python venv
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install Pillow

      - name: Sync app icons
        run: .ci-venv/bin/python scripts/sync_app_icon.py

      - name: Build archive
        run: |
          xcodebuild \
            -project WarMap.xcodeproj \
            -scheme WarMap \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/WarMap.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export unsigned IPA
        run: |
          mkdir -p build/ipa-export
          APP_PATH="build/WarMap.xcarchive/Products/Applications/WarMap.app"
          mkdir -p build/ipa-export/Payload
          cp -R "$APP_PATH" build/ipa-export/Payload/
          cd build/ipa-export && zip -qr ../WarMap.ipa Payload

      - name: Ensure bundle icons and version
        run: .ci-venv/bin/python scripts/patch_ipa.py

      - name: Sync Feather repo icon from IPA artwork
        run: .ci-venv/bin/python scripts/sync_repo_icon.py

      - name: Read marketing version
        id: version
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION = ' WarMap.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = \([^;]*\);/\1/' | tr -d ' ')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refresh repo.json metadata
        run: |
          .ci-venv/bin/python release_esign.py \
            --description "War Map v${{ steps.version.outputs.value }}."

      - name: Publish IPA and repo.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/WarMap.ipa repo.json warmap.png icon.jpeg
          if git diff --staged --quiet; then
            echo "No release changes to publish."
            exit 0
          fi
          git commit -m "Publish War Map v${{ steps.version.outputs.value }} for Feather."
          git push

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WarMap-ipa
          path: build/WarMap.ipa

      - name: Upload repo.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-json
          path: repo.json
